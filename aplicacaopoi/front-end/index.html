<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontos de interesse | Cajazeiras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <div>
                <p class="eyebrow">Mapa colaborativo</p>
                <h1>Pontos de interesse</h1>
                <p class="header-place">Cajazeiras, Paraíba</p>
            </div>
            <div class="header-mark" aria-hidden="true">CA</div>
        </div>
    </header>

    <main class="app-shell">
        <section id="buscar" aria-label="Buscar localização">
            <div class="search-field">
                <label for="localBuscar">Buscar localização</label>
                <div class="search-controls">
                    <input type="search" name="local" id="localBuscar" placeholder="Ex.: praça, escola, rua...">
                    <button type="button" id="btnBuscar">Buscar</button>
                </div>
            </div>
        </section>

        <div class="content-grid">
            <section aria-label="Mapa de Cajazeiras">
                <div class="map-heading">
                    <h2>Mapa</h2>
                    <span>OpenStreetMap</span>
                </div>
                <div id="map"></div>
            </section>

            <section id="form" aria-labelledby="form-title">
                <p class="eyebrow">Cadastro</p>
                <h2 id="form-title">Novo ponto</h2>
                <div class="form-fields">
                    <div>
                        <label for="campoNome">Nome do ponto</label>
                        <input type="text" id="campoNome" placeholder="Ex.: Praça da Matriz">
                    </div>
                    <div>
                        <label for="campoDescricao">Descrição</label>
                        <input type="text" id="campoDescricao" placeholder="Uma breve descrição">
                    </div>
                    <div>
                        <label for="campoTipo">Categoria</label>
                        <select id="campoTipo">
                            <option value="Educação">Educação</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Trabalho">Trabalho</option>
                        </select>
                    </div>
                </div>
                <button type="button" id="btnSalvar">Salvar ponto</button>
            </section>
        </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./script.js"></script>
</body>

</html>
